name: Release

# Publishes the workspace to crates.io. Started by hand on main, with the
# version that Cargo.toml declares (Actions, Release, Run workflow).
#
# The crates.io token is the secret CARGO_REGISTRY_TOKEN of the environment
# "crates-io", which only main can use. The GitHub release, and with it the
# tag, is created last, on the commit that was checked.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in Cargo.toml, such as 1.2.3 (without the v)"
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A published version cannot be replaced, so never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: check the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Releases are made from main."
          crate=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          [ "$crate" = "$VERSION" ] || fail "Cargo.toml declares $crate."
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            fail "v$VERSION has already been released."
          fi

  checks:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  codeql:
    name: CodeQL
    needs: prepare
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  publish:
    name: publish to crates.io
    needs: [checks, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Packages and builds every crate before anything is uploaded.
      - run: cargo publish --workspace --locked --dry-run
      # Uploads the crates in dependency order, leaving out those an earlier
      # run already uploaded. The dry run built them, so nothing is compiled
      # while the token is available.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || {
            echo "::error::Add the secret CARGO_REGISTRY_TOKEN to the environment crates-io."
            exit 1
          }
          names=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].name')
          pending=()
          for name in $names; do
            # A crate that was never published is not in the index (404).
            status=$(curl -sS -o index.json -w '%{http_code}' --output-dir "$RUNNER_TEMP" \
              "https://index.crates.io/${name:0:2}/${name:2:2}/$name")
            case "$status" in
              200) grep -qF "\"vers\":\"$VERSION\"" "$RUNNER_TEMP/index.json" && continue ;;
              404) ;;
              *) echo "::error::crates.io answered $status for $name"; exit 1 ;;
            esac
            pending+=(-p "$name")
          done
          if [ ${#pending[@]} -gt 0 ]; then
            cargo publish "${pending[@]}" --locked --no-verify
          fi

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "v$VERSION" "${args[@]}"
